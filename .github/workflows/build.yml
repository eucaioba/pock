name: macOS build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.4'
          bundler-cache: true
      - name: Install locked dependencies
        run: bundle exec pod install --deployment
      - name: Test downloads
        run: python3 Tests/run.py
      - name: Build Release
        run: bash scripts/build.sh Release
      - name: Build Debug
        run: bash scripts/build.sh Debug
